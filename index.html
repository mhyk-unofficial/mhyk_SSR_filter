        const SKILL_TEMPLATES = [
            "毎ターンのスタミナ回復量が+10", "ターン開始時、一定の確率でメインキャラのスタミナ+50", "3人以上で交流すると確率でスタミナが回復。交流人數が多いほど確率と回復量が上がる", "一定の確率で、OOの獲得時に+70%のボーナスがつく", "パート開始時、一定の確率でメインキャラのOOが+50", "パート開始時、20％の確率でレアリティ4以下のOOの特性が手に入る", "一緒に交流すると、20%の確率で參加したパートナーキャラからの特性付與率+6%", "體調が絶好調の時、50%の確率で交流に參加したパートナーキャラからの特性付與率+12%", "體調が良好の時、60%の確率で交流に參加したパートナーキャラからの特性付與率+12%", "休むの大成功率+70％", "一定の確率で、3ターン間のキャラエピソード發生率が+60％", "一定の確率で、3ターン間のスポットエピソード發生率が+60％", "一定の確率で、3ターン間の全体エピソード發生率が+60％", "一緒に交流すると、10%の確率で成功を大成功にする", "一緒に交流すると、ハプニング率-15"
        ];

        let allCards = [];
        let selectedTraits = new Set();

        function convertToOO(skill) {
            if (!skill) return null;
            if (skill.includes("スタミナ+50")) return SKILL_TEMPLATES[1];
            if (skill.includes("獲得時に+70%")) return SKILL_TEMPLATES[3];
            if (skill.includes("メインキャラの") && skill.includes("+50")) return SKILL_TEMPLATES[4];
            if (skill.includes("20％の確率でレアリティ4以下")) return SKILL_TEMPLATES[5];
            if (skill.includes("特性付與率+6%")) return SKILL_TEMPLATES[6];
            if (skill.includes("體調が絶好調")) return SKILL_TEMPLATES[7];
            if (skill.includes("體調が良好")) return SKILL_TEMPLATES[8];
            if (skill.includes("キャラエピソード")) return SKILL_TEMPLATES[10];
            if (skill.includes("スポットエピソード")) return SKILL_TEMPLATES[11];
            if (skill.includes("全体エピソード")) return SKILL_TEMPLATES[12];
            if (skill.includes("大成功にする")) return SKILL_TEMPLATES[13];
            return SKILL_TEMPLATES.find(t => skill.includes(t.substring(0, 10))) || skill;
        }

        function getStyle(text, isAttr) {
    let themeKey = "pink"; 
    let borderStyle = "border: 1.5px solid transparent;";
    let foundRarity = null;

    if (THEMES[text]) {
        themeKey = text;
    } else {
        let found = false;
        // 先找五色清單
        for (let key in TRAIT_LISTS) {
            for (let r in TRAIT_LISTS[key]) {
                if (TRAIT_LISTS[key][r].includes(text)) {
                    themeKey = key.substring(0, 3);
                    foundRarity = r;
                    found = true; break;
                }
            }
            if (found) break;
        }

        // 如果五色沒找到，找粉色清單
        if (!found) {
            themeKey = "pink";
            for (let r in PINK_TRAITS) {
                if (PINK_TRAITS[r].includes(text)) {
                    foundRarity = r;
                    break;
                }
            }
        }

        // 根據稀有度套用邊框樣式
        if (foundRarity === "金") borderStyle = "border: 2.2px solid #FFD700 !important;";
        else if (foundRarity === "銀") borderStyle = "border: 2.2px solid #B0B0B0 !important;";
        else if (foundRarity === "銅") borderStyle = "border: 2.2px solid #CD7F32 !important;";
        else if (foundRarity === "無") borderStyle = `border: 1.5px solid ${THEMES[themeKey].border} !important;`;
    }

    const t = THEMES[themeKey] || THEMES["pink"];
    return isAttr ? `background:${t.main};color:#fff;border: 1.5px solid ${t.main};` : `background:${t.bg};color:${t.text};${borderStyle}`;
}

        async function init() {
            try {
                const res = await fetch(API_URL);
                allCards = await res.json();
                const container = document.getElementById('traitContainer');
                for (let group in TRAIT_LISTS) {
                    const colorSection = document.createElement('div');
                    colorSection.className = 'color-section';
                    colorSection.style.borderLeft = `8px solid ${THEMES[group.substring(0, 3)].main}`;
                    colorSection.innerHTML = `<span class="color-title">${group}</span>`;
                    for (let r in TRAIT_LISTS[group]) {
                        const row = document.createElement('div');
                        row.className = 'rarity-row';
                        row.innerHTML = `<span class="rarity-label">${r}</span>`;
                        const list = document.createElement('div');
                        list.className = 'trait-list';
                        TRAIT_LISTS[group][r].forEach(t => {
                            const btn = document.createElement('div');
                            btn.className = 'trait-btn';
                            btn.innerText = t;
                            btn.style = getStyle(t, false);
                            btn.onclick = () => {
                                if (selectedTraits.has(t)) selectedTraits.delete(t);
                                else selectedTraits.add(t);
                                btn.classList.toggle('active');
                                render();
                            };
                            list.appendChild(btn);
                        });
                        row.appendChild(list);
                        colorSection.appendChild(row);
                    }
                    container.appendChild(colorSection);
                }
                const sSelect = document.getElementById('skillFilter');
                SKILL_TEMPLATES.forEach(t => {
                    const o = document.createElement('option');
                    o.value = t; o.innerText = t; sSelect.appendChild(o);
                });
                const filterIds = ['keywordSearch', 'nameSearch', 'attrFilter', 'skillFilter', 'sortOrder'];
                filterIds.forEach(id => document.getElementById(id).addEventListener('input', render));
                render();
            } catch (e) { document.getElementById('gallery').innerHTML = "資料載入失敗。"; }
        }

        function clearTraits() {
            selectedTraits.clear();
            document.querySelectorAll('.trait-btn').forEach(b => b.classList.remove('active'));
            render();
        }

        function render() {
    const keywordV = document.getElementById('keywordSearch').value.toLowerCase(); 
    const nameV = document.getElementById('nameSearch').value.toLowerCase();
    const attrV = document.getElementById('attrFilter').value;
    const skillV = document.getElementById('skillFilter').value;
    const sortV = document.getElementById('sortOrder').value;

    let filtered = allCards.filter(card => {
        // 整理這張卡所有的特性成一個陣列
        const cardTraits = [];
        for (let i = 1; i <= 8; i++) if (card[`特性${i}`]) cardTraits.push(card[`特性${i}`]);
        
        // 關鍵字搜尋：包含卡名、技能1、技能2、或是任何一個特性名稱
        const mKeyword = !keywordV || 
                         card["卡片名稱"].toLowerCase().includes(keywordV) || 
                         card["技能1"].includes(keywordV) || 
                         card["技能2"].includes(keywordV) ||
                         cardTraits.some(t => t.includes(keywordV)); // <-- 新增特性關鍵字搜尋

        const mName = card["卡片名稱"].toLowerCase().includes(nameV);
        const mAttr = !attrV || card["卡片屬性"] === attrV;
        const mSkill = !skillV || convertToOO(card["技能1"]) === skillV || convertToOO(card["技能2"]) === skillV;
        
        // 五色按鈕複選篩選
        const mTraits = Array.from(selectedTraits).every(t => cardTraits.includes(t));
        
        return mKeyword && mName && mAttr && mSkill && mTraits;
    });

    // ... 後續排序與渲染代碼維持不變

            filtered.sort((a, b) => {
                if (sortV === 'idAsc') return (parseInt(a["圖鑑編號"]) || 0) - (parseInt(b["圖鑑編號"]) || 0);
                if (sortV === 'idDesc') return (parseInt(b["圖鑑編號"]) || 0) - (parseInt(a["圖鑑編號"]) || 0);
                if (sortV.startsWith('attr')) {
                    const vA = ATTR_ORDER[a["卡片屬性"]] || 99, vB = ATTR_ORDER[b["卡片属性"]] || 99;
                    return sortV === 'attrAsc' ? vA - vB : vB - vA;
                }
                if (sortV.startsWith('char')) {
                    const idxA = CHAR_ORDER.indexOf(CHAR_ORDER.find(c => a["卡片名稱"].includes(c)));
                    const idxB = CHAR_ORDER.indexOf(CHAR_ORDER.find(c => b["卡片名稱"].includes(c)));
                    return sortV === 'charAsc' ? idxA - idxB : idxB - idxA;
                }
                return 0;
            });

            document.getElementById('count').innerText = filtered.length;
            document.getElementById('gallery').innerHTML = filtered.map(card => {
                let tHtml = "";
                for (let i = 1; i <= 8; i++) {
                    const t = card[`特性${i}`];
                    if (t) tHtml += `<span class="badge" style="${getStyle(t, false)}">${t}</span>`;
                }
                return `<div class="card"><img class="card-img" src="${card["縮圖來源網址（勿動）"] || ''}" loading="lazy"><div class="card-body"><div class="card-title">${card["卡片名稱"]}</div><div class="tags-row"><span class="badge" style="${getStyle(card["卡片屬性"], true)}">${card["卡片屬性"]}</span>${tHtml}</div><div class="skill-box"><strong>技能1：</strong> ${card["技能1"]}</div><div class="skill-box"><strong>技能2：</strong> ${card["技能2"]}</div></div></div>`;
            }).join('');
        }

        function toggleTraits() {
            const container = document.getElementById('traitContainer');
            const btn = document.getElementById('toggleBtn');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden'); btn.innerText = '收合';
            } else {
                container.classList.add('hidden'); btn.innerText = '展開';
            }
        }

        init();
    </script>
</body>
</html>
